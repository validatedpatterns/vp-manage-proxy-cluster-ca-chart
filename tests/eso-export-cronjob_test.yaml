suite: eso export cronjob
templates:
  - eso-export-cronjob.yaml
release:
  name: testrel
tests:
  - it: renders export CronJob with ose-cli-rhel9 image
    set:
      eso:
        export:
          enabled: true
      includeIngressCA: true
    asserts:
      - isKind:
          of: CronJob
      - matchRegex:
          path: spec.jobTemplate.spec.template.spec.containers[0].image
          pattern: "^registry\\.redhat\\.io/openshift4/ose-cli-rhel9:v4\\.22$"
      - contains:
          path: spec.jobTemplate.spec.template.spec.containers[0].env
          content:
            name: INCLUDE_INGRESS_CA
            value: "true"
